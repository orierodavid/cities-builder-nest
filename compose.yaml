services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: cbnest-api:local
    restart: unless-stopped
    init: true
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env file}@redis:6379
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    networks:
      - app
      - cache

  worker:
    image: cbnest-api:local
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    init: true
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: production
      EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-false}
    stop_grace_period: 30s
    networks:
      - app

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env file}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env file}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cache

volumes:
  redis_data:

networks:
  app:
    driver: bridge
  cache:
    internal: true
