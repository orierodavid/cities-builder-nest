version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    labels: [dependencies, mobile]

  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    labels: [dependencies, api]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    labels: [dependencies, web]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
