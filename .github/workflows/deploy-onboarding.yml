name: Deploy Onboarding Edge Function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/onboard-account/**"
      - "supabase/functions/resident-registration/**"
      - "supabase/functions/resident-approval/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-onboarding.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ldnxotehzkrrtovelmiz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN secret" && exit 1)
      - name: Deploy onboarding function
        run: supabase functions deploy onboard-account --project-ref "$PROJECT_ID" --yes
      - name: Deploy resident registration function
        run: supabase functions deploy resident-registration --project-ref "$PROJECT_ID" --yes
      - name: Deploy resident approval function
        run: supabase functions deploy resident-approval --project-ref "$PROJECT_ID" --yes
