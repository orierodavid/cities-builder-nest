name: Deploy Squad Electricity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/squad-electricity/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-squad-electricity.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ldnxotehzkrrtovelmiz
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check electricity function
        run: deno check supabase/functions/squad-electricity/index.ts
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate deployment secret
        shell: bash
        run: test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN GitHub Actions secret" && exit 1)
      - name: Deploy Squad electricity
        run: supabase functions deploy squad-electricity --project-ref "$PROJECT_ID" --yes
