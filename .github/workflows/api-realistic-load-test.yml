name: API realistic endpoint load test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/api-realistic-load-test.yml"
      - "apps/api/src/server.ts"
      - "apps/api/src/auth.ts"
      - "apps/api/src/load-test-server.ts"
      - "apps/api/src/database.ts"
      - "apps/api/src/**.repository.ts"
      - "load-tests/**"
      - "docs/LOAD_TESTING.md"
      - "docs/REALISTIC_API_LOAD_TEST.md"
  workflow_dispatch:
    inputs:
      profile:
        description: "Concurrency profile; review each result before selecting the next level"
        required: true
        type: choice
        default: "full"
        options:
          - "full"
          - "250"
          - "500"
          - "1000"

permissions:
  contents: read

concurrency:
  group: api-realistic-load-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  realistic-load-test:
    name: App-role read navigation (250 / 500 / 1,000 VUs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cbnest_load_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cbnest_load_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      NODE_ENV: test
      LOAD_TEST_MODE: "true"
      NATIVE_POSTGRES_READS: "true"
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cbnest_load_test
      DB_POOL_MAX: "30"
      DB_POOL_CONNECTION_TIMEOUT_MS: "10000"
      SUPABASE_URL: http://127.0.0.1:4101
      SUPABASE_ANON_KEY: isolated-load-test-anon-key
      PGRST_JWT_SECRET: cbnest-local-load-test-jwt-secret-32-bytes
      VISITOR_PASS_ENCRYPTION_KEY: isolated-load-test-encryption-secret
      PORT: "4000"
      TRUST_PROXY_HOPS: "1"
      LOAD_TEST_PROFILE: ${{ inputs.profile || 'full' }}
    steps:
      - name: Check out main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package.json

      - name: Install API dependencies
        working-directory: apps/api
        run: npm install --no-audit --no-fund

      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Seed isolated PostgreSQL fixture schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/load-tests/realistic-fixtures.sql"

      - name: Start isolated PostgREST against synthetic PostgreSQL
        run: |
          set -euo pipefail
          docker run --detach --name cbnest-load-postgrest --network host \
            -e PGRST_DB_URI="$DATABASE_URL" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$PGRST_JWT_SECRET" \
            -e PGRST_SERVER_PORT=4100 \
            -e PGRST_DB_POOL=30 \
            postgrest/postgrest:v12.2.3
          ready=0
          for attempt in $(seq 1 30); do
            code=$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:4100/ || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then docker logs cbnest-load-postgrest; exit 1; fi

      - name: Start isolated Supabase Auth stub
        run: |
          set -euo pipefail
          AUTH_STUB_PORT=4101 nohup node "$GITHUB_WORKSPACE/load-tests/mock-supabase-auth.cjs" > "$RUNNER_TEMP/cbnest-auth-stub.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/cbnest-auth-stub.pid"
          ready=0
          for attempt in $(seq 1 30); do
            code=$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:4101/auth/v1/user || true)
            if [ "$code" = "401" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/cbnest-auth-stub.log"
            echo "Isolated auth stub did not start."
            exit 1
          fi

      - name: Start isolated API with native PostgreSQL reads
        working-directory: apps/api
        run: |
          set -euo pipefail
          nohup node dist/load-test-server.js > "$RUNNER_TEMP/cbnest-realistic-api.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/cbnest-realistic-api.pid"
          ready=0
          for attempt in $(seq 1 45); do
            code=$(curl --silent --output "$RUNNER_TEMP/ready.json" --write-out "%{http_code}" \
              http://127.0.0.1:4000/health || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/cbnest-realistic-api.log"
            cat "$RUNNER_TEMP/ready.json" || true
            echo "Real dashboard endpoint did not become ready."
            exit 1
          fi

      - name: Pull pinned k6 runner
        run: docker pull grafana/k6:0.54.0

      - name: Prepare writable k6 output directory
        run: |
          mkdir -p "$RUNNER_TEMP/k6-output"
          chmod 777 "$RUNNER_TEMP/k6-output"

      - name: Run four-role app navigation workload (read-only)
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -v "$RUNNER_TEMP/k6-output:/out" \
            -e LOAD_TEST_ENVIRONMENT=github-actions-ephemeral \
            -e LOAD_TEST_CONFIRM=YES \
            -e LOAD_TEST_MODE=realistic \
            -e LOAD_TEST_BASE_URL=http://127.0.0.1:4000 \
            -e LOAD_TEST_SUPABASE_BASE_URL=http://127.0.0.1:4100 \
            -e LOAD_TEST_SUPABASE_ALLOWED_HOST=127.0.0.1:4100 \
            -e LOAD_TEST_SUPABASE_ANON_KEY=isolated-load-test-anon-key \
            -e LOAD_TEST_ALLOWED_HOST=127.0.0.1:4000 \
            -e LOAD_TEST_ALLOW_LOCAL_HTTP=true \
            -e LOAD_TEST_PROFILE="$LOAD_TEST_PROFILE" \
            grafana/k6:0.54.0 run \
            --summary-export=/out/realistic-load-test-summary.json \
            load-tests/api-realistic.js

      - name: Stop isolated services
        if: always()
        run: |
          docker logs cbnest-load-postgrest > "$RUNNER_TEMP/cbnest-postgrest.log" 2>&1 || true
          docker rm -f cbnest-load-postgrest >/dev/null 2>&1 || true
          for file in "$RUNNER_TEMP/cbnest-realistic-api.pid" "$RUNNER_TEMP/cbnest-auth-stub.pid"; do
            if [ -f "$file" ]; then kill -TERM "$(cat "$file")" 2>/dev/null || true; fi
          done

      - name: Upload realistic load-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbnest-api-realistic-load-test-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/k6-output/realistic-load-test-summary.json
            ${{ runner.temp }}/cbnest-realistic-api.log
            ${{ runner.temp }}/cbnest-auth-stub.log
            ${{ runner.temp }}/cbnest-postgrest.log
          if-no-files-found: warn
          retention-days: 14
