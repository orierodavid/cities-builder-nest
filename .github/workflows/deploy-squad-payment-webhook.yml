name: Deploy Squad Payment Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/squad-payment-webhook/**"
      - "supabase/functions/reconcile-squad-payments/**"
      - "supabase/functions/initiate-squad-payment/**"
      - "supabase/functions/verify-squad-payment/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-squad-payment-webhook.yml"

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ldnxotehzkrrtovelmiz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Squad payment initiation
        run: deno check supabase/functions/initiate-squad-payment/index.ts

      - name: Type-check Squad payment verification
        run: deno check supabase/functions/verify-squad-payment/index.ts

      - name: Type-check Squad webhook
        run: deno check supabase/functions/squad-payment-webhook/index.ts

      - name: Type-check Squad payment reconciliation
        run: deno check supabase/functions/reconcile-squad-payments/index.ts

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secret
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN GitHub Actions secret" && exit 1)

      - name: Deploy payment initiation with project configuration
        run: supabase functions deploy initiate-squad-payment --project-ref "$PROJECT_ID" --yes

      - name: Deploy payment verification with project configuration
        run: supabase functions deploy verify-squad-payment --project-ref "$PROJECT_ID" --yes

      - name: Deploy webhook with project configuration
        run: supabase functions deploy squad-payment-webhook --project-ref "$PROJECT_ID" --yes

      - name: Deploy payment reconciliation with project configuration
        run: supabase functions deploy reconcile-squad-payments --project-ref "$PROJECT_ID" --yes
