name: Regenerate mobile dependency lockfile

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/package.json"
      - ".github/workflows/regenerate-mobile-lockfile.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package.json

      - name: Generate a fresh lockfile from the SDK 58 manifest
        working-directory: apps/mobile
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean npm installation
        working-directory: apps/mobile
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls expo expo-router @expo/ui react react-native

      - name: Commit regenerated lockfile and remove temporary workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package-lock.json
          git rm .github/workflows/regenerate-mobile-lockfile.yml
          git commit -m "chore(mobile): regenerate SDK 58 dependency lockfile"
          git push origin main
