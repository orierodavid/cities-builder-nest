name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visitor_lifecycle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d visitor_lifecycle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      VISITOR_LIFECYCLE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/visitor_lifecycle_test
      ROLE_ISOLATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/role_isolation_test
      REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Create isolated RLS integration test database
        run: PGPASSWORD=postgres createdb -h localhost -U postgres role_isolation_test
      - run: npm run typecheck
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx expo install --check
      - run: npx expo-doctor
      - run: npm run typecheck

  onboarding-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check account login Edge Function
        run: deno check supabase/functions/account-login/index.ts
      - name: Type-check Squad payment webhook Edge Function
        run: deno check supabase/functions/squad-payment-webhook/index.ts
      - name: Type-check onboarding Edge Function
        run: deno check supabase/functions/onboard-account/index.ts
      - name: Type-check password update Edge Function
        run: deno check supabase/functions/update-estate-user-password/index.ts
      - name: Type-check welcome email Edge Function
        run: deno check supabase/functions/send-welcome-email/index.ts
      - name: Type-check resident virtual account Edge Function
        run: deno check supabase/functions/create-resident-virtual-account/index.ts
      - name: Type-check Squad utilities Edge Function
        run: deno check supabase/functions/squad-utilities/index.ts
      - name: Type-check Squad payment verification Edge Function
        run: deno check supabase/functions/verify-squad-payment/index.ts
      - name: Type-check resend invitation Edge Function
        run: deno check supabase/functions/resend-account-invitation/index.ts
      - name: Type-check resident registration Edge Function
        run: deno check supabase/functions/resident-registration/index.ts
      - name: Type-check resident approval Edge Function
        run: deno check supabase/functions/resident-approval/index.ts

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
