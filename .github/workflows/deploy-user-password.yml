name: Deploy Estate User Password Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/update-estate-user-password/**"
      - ".github/workflows/deploy-user-password.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ldnxotehzkrrtovelmiz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate deployment secret
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN secret" && exit 1)
      - name: Deploy estate user password function
        run: supabase functions deploy update-estate-user-password --project-ref "$PROJECT_ID" --yes
