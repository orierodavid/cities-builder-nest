name: Scheduled Security and Maintenance

on:
  schedule:
    # Daily at 05:00 West Africa Time (UTC+1).
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-security-maintenance
  cancel-in-progress: false

jobs:
  dependency-audit:
    name: npm security audit (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - apps/mobile
          - apps/api
          - apps/web
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate a temporary lockfile when needed
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Audit direct and transitive dependencies
        run: npm audit --audit-level=high

      - name: Report available dependency updates
        if: always()
        shell: bash
        run: |
          {
            echo '### ${{ matrix.app }} — available dependency updates'
            echo '```text'
            npm outdated || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  expo-compatibility:
    name: Expo and React Native compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install locked mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Check Expo SDK package compatibility
        run: npx expo install --check

      - name: Report Expo SDK and package versions
        if: always()
        run: |
          {
            echo '### Expo mobile maintenance snapshot'
            echo '```text'
            npx expo --version
            npm ls expo react-native expo-router expo-updates --depth=0 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
